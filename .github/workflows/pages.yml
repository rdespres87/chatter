name: Publish Cargo Docs

on:
  push:
    branches: [ "main" ] # or "master" depending on default branch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
  
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1 # or dtolnay/rust-toolchain
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Generate documentation
        run: cargo doc --no-deps

      - name: Create redirect index page
        run: |
          echo '<meta http-equiv="refresh" content="0; url=chatter/index.html">' > target/doc/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload site artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'target/doc'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
